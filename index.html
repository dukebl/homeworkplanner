<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>ExamPlan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B47F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ExamPlan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FB; --surface:#FFFFFF; --surface2:#E8EDF8; --ink:#13203F; --ink2:#4B5A78; --ink3:#6F7D9A;
  --line:#D8E0EF; --accent:#2B47F5; --accent-soft:#E2E7FF; --on-accent:#FFFFFF;
  --hi:#FFD43B; --on-hi:#3A2E00; --warn:#D92B45; --warn-soft:#FFE1E6; --ok:#0B8F61; --ok-soft:#D9F4E8;
  --grid:rgba(43,71,245,.08);
  --shadow:0 1px 2px rgba(19,32,63,.06),0 10px 24px -14px rgba(19,32,63,.28);
  --f-display:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --r:18px; --r-s:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1326; --surface:#161E39; --surface2:#1F2948; --ink:#EEF2FF; --ink2:#AAB6D4; --ink3:#8391B3;
    --line:#2B3658; --accent:#8196FF; --accent-soft:#222C5C; --on-accent:#0D1326;
    --hi:#FFD43B; --on-hi:#3A2E00; --warn:#FF7285; --warn-soft:#3A1F2C; --ok:#3DD6A0; --ok-soft:#14352B;
    --grid:rgba(129,150,255,.09);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1326; --surface:#161E39; --surface2:#1F2948; --ink:#EEF2FF; --ink2:#AAB6D4; --ink3:#8391B3;
  --line:#2B3658; --accent:#8196FF; --accent-soft:#222C5C; --on-accent:#0D1326;
  --hi:#FFD43B; --on-hi:#3A2E00; --warn:#FF7285; --warn-soft:#3A1F2C; --ok:#3DD6A0; --ok-soft:#14352B;
  --grid:rgba(129,150,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);min-height:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.i{flex:none;display:block}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.shell{max-width:1200px;margin:0 auto}
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font:800 24px/1 var(--f-display);letter-spacing:-.02em}
.brand svg{border-radius:10px}
.top-r{display:flex;align-items:center;gap:8px}
.syncdot{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);padding:6px 10px;border-radius:999px;background:var(--surface2)}
.syncdot i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.syncdot.ok i{background:var(--ok)}
.syncdot.err i{background:var(--warn)}
.icon-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.icon-btn .n{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--warn);color:#fff;font:700 12px/20px var(--f-body);text-align:center}
.main{padding:4px 16px calc(150px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .brand-d{display:none}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--ink3);font:600 11px/1.1 var(--f-body);padding:4px 0 6px;border-radius:14px}
.nav .w{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .w{background:var(--accent-soft)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 16px;border:0;border-radius:28px;background:var(--accent);color:var(--on-accent);font:700 16px var(--f-body);box-shadow:0 12px 24px -10px rgba(43,71,245,.65)}
.fab span{display:none}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;padding:22px 24px 0}
  .nav{position:sticky;top:22px;align-self:start;flex-direction:column;gap:4px;background:transparent;border:0;padding:0;height:max-content}
  .nav .brand-d{display:flex;margin:0 0 18px 10px}
  .nav button{flex-direction:row;gap:12px;padding:8px 10px;font-size:15.5px;text-align:left}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  .nav .w{width:30px;background:none!important}
  .top{padding:0 0 10px;top:0}
  .top .brand{display:none}
  .top{justify-content:flex-end}
  .main{padding:4px 0 120px}
  .fab{right:32px;bottom:32px}
  .fab span{display:inline}
}

/* ---------- hero ---------- */
.hero{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border:1px solid var(--line);border-radius:22px;padding:18px 16px 14px;box-shadow:var(--shadow)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.daytag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--ink2);font-weight:600;font-size:13.5px}
.daytag.is-today{background:var(--hi);color:var(--on-hi)}
.hero h1{font:800 clamp(26px,6.4vw,38px)/1.05 var(--f-display);letter-spacing:-.025em;margin-top:8px}
.daynav{display:flex;gap:6px;flex:none}
.daynav button{height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:600;font-size:14px}
.bars{display:grid;gap:14px}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;font-size:14px}
.bar-k{display:flex;align-items:center;gap:6px;font-weight:700}
.bar-v{color:var(--ink2);text-align:right}
.bar-v em{font-style:normal;margin-left:8px;font-weight:700;color:var(--ok)}
.bar.is-over .bar-v em{color:var(--warn)}
.track{position:relative;display:flex;gap:2px;height:18px;border-radius:9px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.seg{display:block;height:100%;min-width:3px;transform-origin:left center}
.seg.is-done{opacity:.35}
.capmark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.intro .seg{animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.intro .seg:nth-child(2){animation-delay:.06s}.intro .seg:nth-child(3){animation-delay:.12s}.intro .seg:nth-child(4){animation-delay:.18s}.intro .seg:nth-child(n+5){animation-delay:.24s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:14.5px;color:var(--ink2)}
.link{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* ---------- sections, tasks ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sec h2{font:700 20px/1.2 var(--f-display);letter-spacing:-.01em}
.sec .sub{color:var(--ink3);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip.subj i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.subj[aria-pressed="true"]{border-color:var(--c);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--c);color:var(--ink)}
.filters{display:flex;gap:8px;margin-top:20px}
.task{display:flex;align-items:flex-start;gap:4px;padding:6px 14px 6px 4px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;display:grid;place-items:center;width:48px;height:48px;background:none;border:0;padding:0}
.chk::before{content:"";position:absolute}
.chk{position:relative}
.chk svg{position:relative;z-index:1;opacity:0;width:16px;height:16px;color:#fff}
.chk::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--c);background:transparent;transition:background .15s}
.task.is-done .chk::after{background:var(--c)}
.task.is-done .chk svg{opacity:1}
.tb{flex:1;min-width:0;padding:10px 0 8px;cursor:pointer}
.tt{font-weight:600;font-size:16.5px;line-height:1.3;overflow-wrap:anywhere}
.task.is-done .tt{text-decoration:line-through;color:var(--ink3)}
.task.is-done .tm{opacity:.6}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;margin-top:5px;color:var(--ink2);font-size:13.5px}
.tm .m{display:inline-flex;align-items:center;gap:4px}
.tm .due.soon{color:var(--on-hi);background:var(--hi);padding:0 7px;border-radius:999px;font-weight:600}
.tm .due.late{color:#fff;background:var(--warn);padding:0 7px;border-radius:999px;font-weight:600}
.tn{margin-top:5px;font-size:14px;color:var(--ink3);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;padding:1px 8px;border-radius:7px;background:var(--c);color:var(--fg);font-weight:700;font-size:12.5px}
.empty{padding:26px 18px;text-align:center;color:var(--ink2)}
.empty strong{display:block;font:700 18px var(--f-display);color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:14px}
.late-panel{border-color:var(--warn)}
.late-panel .task .mv{align-self:center;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{min-height:38px;padding:0 14px;font-size:14px;border-radius:11px}
.btn.block{display:flex;width:100%}

/* events / countdown */
.evt{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-top:1px solid var(--line);cursor:pointer}
.evt:first-child{border-top:0}
.cd{flex:none;width:64px;padding:8px 4px;border-radius:14px;text-align:center;background:var(--surface2);line-height:1}
.cd strong{display:block;font:800 26px/1 var(--f-display)}
.cd span{display:block;margin-top:3px;font-size:12px;font-weight:600}
.cd.hot{background:var(--warn);color:#fff}
.cd.soon{background:var(--hi);color:var(--on-hi)}
.cd.past{opacity:.55}
.cd.txt strong{font-size:16px;padding:5px 0 1px}
.evt-b{flex:1;min-width:0}
.evt-t{font-weight:600;overflow-wrap:anywhere}
.evt-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;color:var(--ink2);font-size:13.5px}

/* week */
.wk-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.wk-head h1{font:800 clamp(28px,7vw,40px)/1 var(--f-display);letter-spacing:-.025em}
.wk-head p{color:var(--ink2);margin-top:6px}
.wk-stats{margin-top:16px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:10px}
.prog{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:5px}
.wk-stats .row{display:flex;justify-content:space-between;gap:10px;color:var(--ink2);font-size:14.5px}
.wk-stats b{color:var(--ink)}
.wgrid{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.wday.is-today{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.wday.is-weekend{background:var(--surface2)}
.wd-h{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 0 14px}
.wd-h .open{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:8px 0;text-align:left}
.wd-h .nm{font:800 20px var(--f-display)}
.wd-h .dt{color:var(--ink2);font-size:14px}
.wd-h .ad{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--accent);display:grid;place-items:center}
.wd-bars{padding:2px 14px 6px;display:grid;gap:7px}
.mini .bar-head{margin-bottom:3px;font-size:12.5px}
.mini .track{height:10px;border-radius:5px}
.wd-list{border-top:1px solid var(--line);margin-top:auto}
.wd-list .task{padding-right:10px}
.wd-list .tt{font-size:15px}
.wd-none{padding:10px 14px 14px;color:var(--ink3);font-size:14px}
.wd-evt{display:flex;align-items:center;gap:8px;margin:2px 14px 8px;padding:6px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13.5px}

/* vakken */
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
.vcard{display:grid;gap:10px;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.mono{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:var(--c);color:var(--fg);font:800 20px var(--f-display);letter-spacing:-.02em}
.vn{font:700 19px/1.2 var(--f-display)}
.vs{display:flex;flex-direction:column;gap:3px;color:var(--ink2);font-size:14px}
.vs b{color:var(--ink)}
.vs .hot{color:var(--warn);font-weight:700}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.page-h h1{font:800 clamp(26px,6.5vw,38px)/1.05 var(--f-display);letter-spacing:-.025em}
.vhero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);margin-top:10px}
.vhero .mono{width:64px;height:64px;font-size:24px}
.vhero p{color:var(--ink2);margin-top:4px}
.ph-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.ph-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.ph{display:block;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;text-align:left}
.ph img{display:block;width:100%;height:160px;object-fit:cover;background:var(--surface2)}
.ph span{display:block;padding:8px 10px;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:12px 14px;border-radius:12px;background:var(--surface2);color:var(--ink2);font-size:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
details.fold summary{cursor:pointer;padding:12px 4px;font-weight:700;color:var(--ink2)}

/* settings */
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.set-card h3{font:700 18px var(--f-display);margin-bottom:4px}
.set-card p{color:var(--ink2);font-size:14.5px}
.set-card p+*{margin-top:12px}
.captable{width:100%;border-collapse:collapse}
.captable th,.captable td{padding:5px 4px;text-align:left;font-size:14.5px}
.captable thead th{color:var(--ink3);font-weight:600;font-size:13px}
.captable tbody th{font-weight:600}
.captable input{width:100%;max-width:110px}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
ol.steps{margin:10px 0 0;padding-left:20px;color:var(--ink2);font-size:14.5px}
ol.steps li{margin:4px 0}

/* forms */
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],textarea,select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field{margin-top:18px}
.field>label,.field>.lab{display:block;margin-bottom:8px;font-weight:700;font-size:14.5px}
.field .hint{margin-top:6px;color:var(--ink3);font-size:13.5px}
.err{margin-top:6px;color:var(--warn);font-weight:600;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{margin-bottom:8px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(9,14,32,.55)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.35);animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 6px 20px}
.sh-head h2{font:800 22px var(--f-display);letter-spacing:-.015em}
.sh-body{padding:0 20px 8px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sh-foot{display:flex;gap:10px;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-foot .primary{flex:1}
@media (min-width:700px){
  .sh{left:50%;right:auto;bottom:auto;top:50%;width:540px;max-height:88%;transform:translate(-50%,-50%);border-radius:24px;animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
}
.alert-item{padding:12px 0;border-top:1px solid var(--line)}
.alert-item:first-child{border-top:0}
.alert-item strong{display:block}
.alert-item span{color:var(--ink2);font-size:14px}
.alert-item em{font-style:normal;color:var(--warn);font-weight:700;font-size:13px;margin-left:6px}

/* toasts */
#toasts{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:90;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;width:min(440px,100%);padding:12px 8px 12px 14px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:up .2s ease-out}
.toast.rem{background:var(--hi);color:var(--on-hi)}
.toast-i{padding-top:2px}
.toast-b{flex:1;min-width:0;display:flex;flex-direction:column}
.toast-b span{font-size:14px;opacity:.85}
.toast button{flex:none;width:34px;height:34px;display:grid;place-items:center;background:none;border:0;color:inherit;border-radius:10px}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;background:#05070f;color:#fff}
#lightbox.open{display:flex}
.lb-bar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.lb-bar button{height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;gap:6px;font-weight:600}
.lb-bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85;font-size:14px}
.lb-stage{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;margin:auto;display:block;cursor:zoom-in}
.lb-stage img.zoom{max-width:none;max-height:none;width:260%;margin:0;cursor:zoom-out}
.lb-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.lb-foot input{flex:1 1 200px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.lb-foot .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.lb-foot .btn.danger{color:#ff8b9a;border-color:#ff8b9a}

.welcome{margin-top:16px;padding:18px;border-radius:var(--r);background:var(--accent);color:var(--on-accent)}
.welcome h2{font:800 22px var(--f-display);letter-spacing:-.015em}
.welcome p{margin-top:6px;opacity:.92}
.welcome .row2{margin-top:14px}
.welcome .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:inherit}
.welcome .btn.first{background:var(--hi);border-color:var(--hi);color:var(--on-hi)}
.welcome .link{color:inherit;opacity:.85}

        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#2B47F5"/><path d="M8.5 0v34M17 0v34M25.5 0v34M0 8.5h34M0 17h34M0 25.5h34" stroke="#fff" stroke-opacity=".16"/><path d="M9.5 18l5 5 10-11.5" fill="none" stroke="#FFD43B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

<input type="file" id="fileGal" accept="image/*" multiple hidden>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v==null?(mem[k]==null?null:mem[k]):v}catch(e){return mem[k]==null?null:mem[k]}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}
};

/* ---------- icons ---------- */
const P={
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>',
  flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',
  sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  school:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  left:'<path d="m15 6-6 6 6 6"/>',
  right:'<path d="m9 6 6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const icon=(n,s)=>`<svg class="i" width="${s||20}" height="${s||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]||''}</svg>`;

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const DOW=['zo','ma','di','wo','do','vr','za'];
const DOWL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MON=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MONL=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const dowIdx=s=>(pd(s).getDay()+6)%7;
const weekStart=s=>addDays(s,-dowIdx(s));
const isoWeek=s=>{const d=pd(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
const fmtD=s=>{const d=pd(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const fmtL=s=>{const d=pd(s);const t=DOWL[d.getDay()];return `${t[0].toUpperCase()+t.slice(1)} ${d.getDate()} ${MONL[d.getMonth()]}`};
const rel=s=>{const n=diffDays(s,today());if(n===0)return'vandaag';if(n===1)return'morgen';if(n===-1)return'gisteren';if(n>1&&n<=14)return`over ${n} dagen`;if(n<-1&&n>=-14)return`${-n} dagen geleden`;return fmtD(s)};
const fmtMin=n=>{n=Math.round(+n||0);if(n<60)return n+'m';const h=Math.floor(n/60),m=n%60;return m?`${h}u ${m}m`:`${h}u`};
const fmtDT=s=>{if(!s)return'';const p=s.split('T');const d=p[0];const n=diffDays(d,today());const lab=n===0?'vandaag':n===1?'morgen':fmtD(d);return `${lab} ${p[1]||''}`};
const atTime=(d,t)=>new Date(`${d}T${t||'16:00'}`);

/* ---------- data ---------- */
const lum=h=>{const n=parseInt(h.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;return(.299*r+.587*g+.114*b)/255};
const SUBJ=[
  {id:'wib',name:'Wiskunde B',short:'Wi B',color:'#3355FF'},
  {id:'ne',name:'Nederlands',short:'Ne',color:'#E8590C'},
  {id:'en',name:'Engels',short:'En',color:'#0CA678'},
  {id:'na',name:'Natuurkunde',short:'Na',color:'#7048E8'},
  {id:'sk',name:'Scheikunde',short:'Sk',color:'#D6336C'},
  {id:'in',name:'Informatica',short:'In',color:'#1098AD'},
  {id:'oo',name:'Onderzoek & Ontwerp',short:'O&O',color:'#F2A100'},
  {id:'pws',name:'PWS',short:'PWS',color:'#5C6B7A'}
].map(s=>Object.assign(s,{fg:lum(s.color)>.6?'#1A1A1A':'#FFFFFF'}));
const subj=id=>SUBJ.find(s=>s.id===id)||SUBJ[0];
const KINDS=['Toets','Schoolexamen','Mondeling','Inleverdatum','Anders'];

const defSynced=()=>({tasks:[],tests:[],cap:{thuis:[120,120,120,120,120,90,90],school:[30,30,30,30,30,0,0]},over:{},set:{remindTime:'16:00',daily:true,dailyTime:'16:00'},updatedAt:0});
function normalize(o){const d=defSynced();o=o||{};d.tasks=Array.isArray(o.tasks)?o.tasks:[];d.tests=Array.isArray(o.tests)?o.tests:[];
  if(o.cap){['thuis','school'].forEach(k=>{if(Array.isArray(o.cap[k])&&o.cap[k].length===7)d.cap[k]=o.cap[k].map(n=>clamp(parseInt(n)||0,0,1440))})}
  d.over=o.over&&typeof o.over==='object'?o.over:{};d.set=Object.assign(d.set,o.set||{});d.updatedAt=+o.updatedAt||0;return d}
let S=(function(){try{const r=store.get('examplan.v1');if(r)return normalize(JSON.parse(r))}catch(e){}return defSynced()})();
let L=(function(){const d={fired:{},alerts:[],theme:'auto',lastSubject:'wib',welcomed:false};try{const r=store.get('examplan.local');if(r)return Object.assign(d,JSON.parse(r))}catch(e){}return d})();
const saveLocal=()=>store.set('examplan.local',JSON.stringify(L));
function save(){S.updatedAt=Date.now();store.set('examplan.v1',JSON.stringify(S));queueSync()}

/* ---------- sync (optional, via Claude account) ---------- */
const sync={status:'local',ref:null,writing:false,dirty:false,timer:null};
function syncBadge(){
  const el=$('#syncdot');if(!el)return;
  if(sync.status==='local'){el.hidden=true;return}
  el.hidden=false;el.className='syncdot '+(sync.status==='ok'?'ok':'err');
  el.lastChild.textContent=sync.status==='ok'?'Gesynchroniseerd':'Sync-fout';
}
async function initSync(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const db=await window.claude.use('db');const user=await window.claude.use('user');
    if(!db||!user||typeof user.id!=='function')return;
    const id=await user.id();if(!id)return;
    sync.ref=db.doc('data/users/'+id+'/examplan');
    sync.ref.onSnapshot(snap=>{
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      sync.status='ok';
      if(!snap.exists){if(S.updatedAt>0)flush();syncBadge();if(ui.view==='meer')render();return}
      const rem=JSON.parse(JSON.stringify(snap.data()||{}));
      const ru=+rem.updatedAt||0;
      if(rem.state&&ru>S.updatedAt){S=normalize(rem.state);S.updatedAt=ru;store.set('examplan.v1',JSON.stringify(S));render()}
      else if(S.updatedAt>ru){flush()}
      syncBadge();if(ui.view==='meer')render();
    },()=>{sync.status='err';syncBadge()});
  }catch(e){}
}
function queueSync(){if(!sync.ref)return;clearTimeout(sync.timer);sync.timer=setTimeout(flush,900)}
async function flush(){
  if(!sync.ref)return;
  if(sync.writing){sync.dirty=true;return}
  sync.writing=true;
  try{await sync.ref.set({state:JSON.parse(JSON.stringify(S)),updatedAt:S.updatedAt});sync.status='ok'}catch(e){sync.status='err'}
  sync.writing=false;syncBadge();
  if(sync.dirty){sync.dirty=false;flush()}
}

/* ---------- photos (local to this device) ---------- */
let photos=[];const pdb={db:null,ready:false};
function idbOpen(){return new Promise((res,rej)=>{try{const r=indexedDB.open('examplan-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const idbAll=()=>new Promise((res,rej)=>{const q=pdb.db.transaction('photos').objectStore('photos').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});
const idbPut=p=>new Promise((res,rej)=>{if(!pdb.db)return res();const t=pdb.db.transaction('photos','readwrite');t.objectStore('photos').put(p);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
const idbDel=id=>new Promise((res,rej)=>{if(!pdb.db)return res();const t=pdb.db.transaction('photos','readwrite');t.objectStore('photos').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
async function photosInit(){
  try{pdb.db=await idbOpen();photos=(await idbAll()).sort((a,b)=>b.ts-a.ts)}catch(e){pdb.db=null}
  pdb.ready=true;render();
}
function shrink(file){return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=()=>rej(fr.error);
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('img'));
    im.onload=()=>{try{const r=Math.min(1,2000/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.76))}catch(e){rej(e)}};
    im.src=fr.result};
  fr.readAsDataURL(file)})}
async function addPhotos(files,sid){
  let n=0;
  for(const f of files){
    try{const data=await shrink(f);const p={id:uid(),subject:sid,ts:Date.now(),caption:'',data};await idbPut(p);photos.unshift(p);n++}
    catch(e){toast('Foto mislukt','Deze foto kon niet worden opgeslagen. Probeer het nog een keer.',{icon:'image',ttl:5000})}
  }
  if(n){toast(n===1?'Foto opgeslagen':`${n} foto's opgeslagen`,`Bij ${subj(sid).name}`,{icon:'camera'});render()}
}

/* ---------- ui state ---------- */
const ui={view:'dag',date:today(),ws:weekStart(today()),subj:null,filter:'alles',photoSubj:null};
let cur=null;

/* ---------- derived ---------- */
const tasksOn=d=>S.tasks.filter(t=>t.date===d);
const capFor=(d,k)=>{const o=S.over[d];if(o&&o[k]!=null)return o[k];return S.cap[k][dowIdx(d)]};
const sortT=a=>a.slice().sort((x,y)=>(x.done-y.done)||(SUBJ.findIndex(s=>s.id===x.subject)-SUBJ.findIndex(s=>s.id===y.subject))||String(x.title).localeCompare(y.title));
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:0;
function eventsOn(d){
  const a=S.tests.filter(t=>t.date===d).map(t=>({kind:t.kind,title:t.title,subject:t.subject}));
  S.tasks.filter(t=>t.due===d&&!t.done).forEach(t=>a.push({kind:'Deadline',title:t.title,subject:t.subject}));
  return a;
}
function upcoming(n){
  const t0=today();
  const a=S.tests.filter(t=>t.date>=t0).map(t=>({type:'test',id:t.id,date:t.date,subject:t.subject,label:t.kind,title:t.title}));
  S.tasks.filter(t=>!t.done&&t.due&&t.due>=t0).forEach(t=>a.push({type:'task',id:t.id,date:t.due,subject:t.subject,label:'Deadline',title:t.title}));
  return a.sort(byDate).slice(0,n);
}

/* ---------- toasts, notifications, reminders ---------- */
let ICON='';
function toast(title,body,o){
  o=o||{};const box=$('#toasts');const t=document.createElement('div');
  t.className='toast'+(o.kind?' '+o.kind:'');
  t.innerHTML=`<div class="toast-i">${icon(o.icon||'check',20)}</div><div class="toast-b"><strong>${esc(title)}</strong>${body?`<span>${esc(body)}</span>`:''}</div><button data-act="toast-x" aria-label="Sluiten">${icon('x',18)}</button>`;
  box.appendChild(t);
  if(o.ttl!==0)setTimeout(()=>t.remove(),o.ttl||3200);
  while(box.children.length>3)box.firstChild.remove();
}
function sysNotify(title,body,tag){
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification(title,{body:body,tag:tag,icon:ICON||undefined});n.onclick=()=>{try{window.focus()}catch(e){}n.close()}}}catch(e){}
}
function buildReminders(){
  const out=[],t0=today();
  S.tasks.forEach(t=>{if(!t.done&&t.remind){out.push({id:`t:${t.id}:${t.remind}`,at:new Date(t.remind),title:`${subj(t.subject).name}: ${t.title}`,body:t.due?`Deadline ${rel(t.due)}, ${fmtMin(t.min)}`:`Gepland ${rel(t.date)}, ${fmtMin(t.min)}`})}});
  S.tests.forEach(x=>{if(x.date<t0)return;(x.remindDays||[]).forEach(d=>{const at=atTime(addDays(x.date,-d),S.set.remindTime);out.push({id:`x:${x.id}:${d}:${S.set.remindTime}`,at:at,title:`${x.kind} ${subj(x.subject).name}${x.title?': '+x.title:''}`,body:d===1?'Morgen is het zover.':`Over ${d} dagen, ${fmtD(x.date)}.`})})});
  if(S.set.daily){const tt=tasksOn(t0).filter(t=>!t.done);if(tt.length){const home=tt.filter(t=>t.where==='thuis').reduce((a,t)=>a+(+t.min||0),0);out.push({id:`d:${t0}`,at:atTime(t0,S.set.dailyTime),title:'Je plan voor vandaag',body:`${tt.length} ${tt.length===1?'taak':'taken'} open, ${fmtMin(home)} thuis.`})}}
  return out;
}
function checkReminders(){
  const now=Date.now();let missed=0,changed=false;
  buildReminders().forEach(r=>{
    const at=r.at.getTime();if(isNaN(at)||at>now||L.fired[r.id])return;
    changed=true;L.fired[r.id]=now;
    if(now-at>3*864e5)return;
    const late=now-at>3*60*1000;
    L.alerts.unshift({id:r.id,ts:now,at:at,title:r.title,body:r.body,missed:late,seen:false});
    if(late){missed++}else{toast(r.title,r.body,{kind:'rem',icon:'bell',ttl:0});sysNotify(r.title,r.body,r.id);try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}}
  });
  if(changed){
    L.alerts=L.alerts.slice(0,60);
    const cut=now-60*864e5;Object.keys(L.fired).forEach(k=>{if(L.fired[k]<cut)delete L.fired[k]});
    saveLocal();renderBell();
    if(missed)toast(missed===1?'1 herinnering gemist':`${missed} herinneringen gemist`,'Tik op het klokje om ze te bekijken.',{kind:'rem',icon:'bell',ttl:7000});
  }
}

/* ---------- pieces ---------- */
function bar(d,k,mini){
  const cap=capFor(d,k),ts=tasksOn(d).filter(t=>t.where===k&&(+t.min||0)>0);
  const tot=tasksOn(d).filter(t=>t.where===k).reduce((a,t)=>a+(+t.min||0),0);
  const scale=Math.max(cap,tot,1),over=tot>cap;
  const segs=ts.map(t=>`<i class="seg${t.done?' is-done':''}" style="flex:0 0 ${(t.min/scale*100).toFixed(2)}%;background:${subj(t.subject).color}"></i>`).join('');
  const mark=over&&cap>0?`<b class="capmark" style="left:${(cap/scale*100).toFixed(2)}%"></b>`:'';
  const name=k==='thuis'?'Thuis':'School';
  const txt=cap===0&&tot===0?'geen tijd ingesteld':over?`${fmtMin(tot-cap)} te veel`:`${fmtMin(cap-tot)} vrij`;
  const aria=`${name}: ${fmtMin(tot)} gepland van ${fmtMin(cap)}, ${txt}`;
  const head=mini?`<span class="bar-k">${icon(k==='thuis'?'home':'school',15)}${name}</span><span class="bar-v">${fmtMin(tot)} / ${fmtMin(cap)}</span>`
    :`<span class="bar-k">${icon(k==='thuis'?'home':'school',18)}${name}</span><span class="bar-v">${fmtMin(tot)} van ${fmtMin(cap)}<em>${txt}</em></span>`;
  return `<div class="bar${over?' is-over':''}"><div class="bar-head">${head}</div><div class="track" role="img" aria-label="${esc(aria)}">${segs}${mark}</div></div>`;
}
function taskRow(t,o){
  o=o||{};const s=subj(t.subject);
  const due=t.due?diffDays(t.due,today()):0;
  const dc=t.due&&!t.done?(due<0?'late':due<=2?'soon':''):'';
  return `<div class="task${t.done?' is-done':''}" data-id="${t.id}">
    <button class="chk" data-act="toggle" data-id="${t.id}" role="checkbox" aria-checked="${!!t.done}" aria-label="${esc(t.title)} afvinken" style="--c:${s.color}">${icon('check',16)}</button>
    <div class="tb" data-act="edit-task" data-id="${t.id}" role="button" tabindex="0">
      <div class="tt">${esc(t.title)}</div>
      <div class="tm">
        <span class="badge" style="--c:${s.color};--fg:${s.fg}">${esc(s.short)}</span>
        ${t.min?`<span class="m">${icon('clock',14)}${fmtMin(t.min)}</span>`:''}
        <span class="m">${icon(t.where==='school'?'school':'home',14)}${t.where==='school'?'School':'Thuis'}</span>
        ${o.showDate?`<span class="m">${icon('calendar',14)}${fmtD(t.date)}</span>`:''}
        ${t.due?`<span class="m due ${dc}">${icon('flag',14)}deadline ${rel(t.due)}</span>`:''}
        ${t.remind&&!t.done?`<span class="m">${icon('bell',14)}${esc(fmtDT(t.remind))}</span>`:''}
      </div>
      ${t.notes&&!o.compact?`<div class="tn">${esc(t.notes)}</div>`:''}
    </div>
    ${o.move?`<button class="btn small mv" data-act="move-today" data-id="${t.id}">Naar vandaag</button>`:''}
  </div>`;
}
function countdown(date){
  const n=diffDays(date,today());
  if(n<0)return `<div class="cd past txt"><strong>${-n}</strong><span>${-n===1?'dag terug':'dagen terug'}</span></div>`;
  if(n===0)return `<div class="cd hot txt"><strong>Vandaag</strong><span>&nbsp;</span></div>`;
  if(n===1)return `<div class="cd hot txt"><strong>Morgen</strong><span>&nbsp;</span></div>`;
  return `<div class="cd ${n<=2?'hot':n<=7?'soon':''}"><strong>${n}</strong><span>dagen</span></div>`;
}
function testRow(x){
  const s=subj(x.subject);
  return `<div class="evt" data-act="edit-test" data-id="${x.id}" role="button" tabindex="0">
    ${countdown(x.date)}
    <div class="evt-b"><div class="evt-t">${esc(x.kind)}${x.title?': '+esc(x.title):''}</div>
    <div class="evt-m"><span class="badge" style="--c:${s.color};--fg:${s.fg}">${esc(s.name)}</span><span>${fmtL(x.date)}</span></div></div>
    ${x.date>=today()?`<button class="btn small" data-act="plan-study" data-id="${x.id}">Leertaak</button>`:''}
  </div>`;
}
function upRow(u){
  const s=subj(u.subject);
  return `<div class="evt" data-act="${u.type==='test'?'edit-test':'edit-task'}" data-id="${u.id}" role="button" tabindex="0">
    ${countdown(u.date)}
    <div class="evt-b"><div class="evt-t">${esc(u.label)}: ${esc(u.title||s.name)}</div>
    <div class="evt-m"><span class="badge" style="--c:${s.color};--fg:${s.fg}">${esc(s.short)}</span><span>${fmtL(u.date)}</span></div></div>
  </div>`;
}

  <section class="sec" style="margin-top:14px"><div class="panel">${list.length?list.map(t=>taskRow(t)).join(''):`<div class="empty"><strong>${all.length?'Niets in dit filter':'Nog niets gepland'}</strong>${all.length?'Kies Alles om je andere taken te zien.':'Voeg een taak toe voor deze dag.'}<br><button class="btn primary" data-act="new-task" data-d="${d}">${icon('plus',18)}Taak toevoegen</button></div>`}</div></section>

function viewWeek(){
  const ws=ui.ws,days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i)),t0=today();
  const wt=S.tasks.filter(t=>t.date>=ws&&t.date<=days[6]);
  const done=wt.filter(t=>t.done).length;
  const plan=days.reduce((a,d)=>a+tasksOn(d).reduce((x,t)=>x+(+t.min||0),0),0);
  const cap=days.reduce((a,d)=>a+capFor(d,'thuis')+capFor(d,'school'),0);
  const pct=wt.length?Math.round(done/wt.length*100):0;
  const dl=S.tasks.filter(t=>!t.done&&t.due&&t.due>=ws&&t.due<=days[6]).length+S.tests.filter(x=>x.date>=ws&&x.date<=days[6]).length;
  const a=pd(ws),b=pd(days[6]);
  const range=`${a.getDate()} ${MON[a.getMonth()]} t/m ${b.getDate()} ${MON[b.getMonth()]}`;
  return `
  <div class="wk-head"><div><h1>Week ${isoWeek(ws)}</h1><p>${range}</p></div>
    <div class="daynav"><button data-act="week-prev" aria-label="Vorige week">${icon('left',20)}</button>${ws===weekStart(t0)?'':`<button data-act="week-this">Deze week</button>`}<button data-act="week-next" aria-label="Volgende week">${icon('right',20)}</button></div></div>
  <div class="wk-stats">
    <div class="row"><span><b>${done}</b> van <b>${wt.length}</b> taken af</span><span>${dl?`<b>${dl}</b> ${dl===1?'toets of deadline':'toetsen of deadlines'}`:'geen toetsen of deadlines'}</span></div>
    <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Voortgang van de week"><i style="width:${pct}%"></i></div>
    <div class="row"><span>Gepland: <b>${fmtMin(plan)}</b></span><span>Beschikbaar: <b>${fmtMin(cap)}</b></span></div>
  </div>
  <div class="wgrid">${days.map(d=>{
    const ts=sortT(tasksOn(d)),ev=eventsOn(d),dw=dowIdx(d);
    return `<article class="wday${d===t0?' is-today':''}${dw>=5?' is-weekend':''}">
      <div class="wd-h"><button class="open" data-act="open-day" data-d="${d}"><span class="nm">${DOW[pd(d).getDay()][0].toUpperCase()+DOW[pd(d).getDay()].slice(1)}</span><span class="dt">${pd(d).getDate()} ${MON[pd(d).getMonth()]}</span></button><button class="ad" data-act="new-task" data-d="${d}" aria-label="Taak toevoegen op ${fmtD(d)}">${icon('plus',22)}</button></div>
      <div class="wd-bars mini">${bar(d,'thuis',true)}${bar(d,'school',true)}</div>
      ${ev.map(e=>`<div class="wd-evt">${icon('flag',15)}${esc(e.kind)}: ${esc(subj(e.subject).short)}${e.title?' '+esc(e.title):''}</div>`).join('')}
      ${ts.length?`<div class="wd-list">${ts.map(t=>taskRow(t,{compact:true})).join('')}</div>`:`<div class="wd-none">Niets gepland</div>`}
    </article>`}).join('')}</div>`;
}

  </section>

function notifBlock(){
  if(!('Notification' in window))return `<p>Je browser ondersteunt geen systeemmeldingen. Herinneringen verschijnen wel in de app zelf, onder het klokje.</p>`;
  const p=Notification.permission;
  if(p==='granted')return `<p>Systeemmeldingen staan aan.</p><div class="row2"><button class="btn small" data-act="notif-test">Testmelding sturen</button></div>`;
  if(p==='denied')return `<p>Meldingen zijn geblokkeerd in de instellingen van je browser. Zet ze daar aan voor deze site.</p>`;
  return `<p>Laat ExamPlan je een melding sturen als een herinnering aan de beurt is.</p><div class="row2"><button class="btn primary small" data-act="notif-on">${icon('bell',16)}Meldingen aanzetten</button></div>`;
}
function viewMeer(){

  return `<div class="page-h" style="margin-top:8px"><h1>Instellingen</h1></div>
  <div class="set-card"><h3>Tijd per dag</h3><p>Hoeveel minuten heb je gemiddeld voor huiswerk? Thuis en op school (bijvoorbeeld tussenuren). Per dag kun je dit aanpassen op het Vandaag-scherm.</p>
    <table class="captable"><thead><tr><th></th><th>Thuis</th><th>School</th></tr></thead><tbody>
    ${DOWL.slice(1).concat(DOWL[0]).map((n,i)=>`<tr><th scope="row">${n[0].toUpperCase()+n.slice(1)}</th><td><input type="number" inputmode="numeric" min="0" max="1440" step="5" value="${S.cap.thuis[i]}" data-cap="thuis:${i}" aria-label="Minuten thuis op ${n}"></td><td><input type="number" inputmode="numeric" min="0" max="1440" step="5" value="${S.cap.school[i]}" data-cap="school:${i}" aria-label="Minuten op school op ${n}"></td></tr>`).join('')}
    </tbody></table></div>
  <div class="set-card"><h3>Herinneringen</h3>

    ${notifBlock()}
    <div class="field"><label for="s-rt">Standaardtijd voor toetsherinneringen</label><input type="time" id="s-rt" value="${esc(S.set.remindTime)}" data-sset="remindTime" style="max-width:160px"></div>
    <label class="switch"><input type="checkbox" data-sset="daily" ${S.set.daily?'checked':''}>Dagelijks overzicht van je taken</label>
    <div class="field" style="margin-top:4px"><label for="s-dt">Tijd voor het dagelijkse overzicht</label><input type="time" id="s-dt" value="${esc(S.set.dailyTime)}" data-sset="dailyTime" style="max-width:160px"></div></div>
  <div class="set-card"><h3>Op je beginscherm zetten</h3>
    <p>Dan opent ExamPlan als een app.</p>
    <ol class="steps"><li><b>iPhone (Safari):</b> tik op Deel en kies Zet op beginscherm.</li><li><b>Android (Chrome):</b> tik op het menu met de drie puntjes en kies Toevoegen aan startscherm.</li><li><b>Laptop:</b> open dezelfde link in je browser en zet hem in je bladwijzers.</li></ol></div>
  <div class="set-card"><h3>Synchronisatie</h3><p>${syncTxt}</p></div>

  <div class="set-card"><h3>Back-up</h3><p>Kopieer je planning (zonder foto's) als tekst, of plak een eerdere back-up om te herstellen.</p>

    <div class="row2"><button class="btn small" data-act="bk-make">Back-up maken</button><button class="btn small" data-act="bk-copy">Kopiëren</button><button class="btn small danger" data-act="bk-restore">Herstellen</button></div>

/* ---------- render ---------- */
const TABS=[['dag','Vandaag','sun'],['week','Week','calendar'],['vakken','Vakken','book'],['toetsen','Toetsen','flag'],['meer','Instellingen','sliders']];
function renderNav(){
  $('#nav').innerHTML=`<div class="brand brand-d"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#2B47F5"/><path d="M8.5 0v34M17 0v34M25.5 0v34M0 8.5h34M0 17h34M0 25.5h34" stroke="#fff" stroke-opacity=".16"/><path d="M9.5 18l5 5 10-11.5" fill="none" stroke="#FFD43B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ExamPlan</span></div>`+
    TABS.map(t=>`<button data-act="nav" data-v="${t[0]}" ${ui.view===t[0]?'aria-current="page"':''}><span class="w">${icon(t[2],22)}</span><span>${t[1]}</span></button>`).join('');
}
function renderBell(){
  const n=L.alerts.filter(a=>!a.seen).length;
  $('#bell').innerHTML=icon('bell',22)+(n?`<span class="n">${n}</span>`:'');
  $('#bell').setAttribute('aria-label',n?`Herinneringen, ${n} nieuw`:'Herinneringen');
  try{document.title=(n?`(${n}) `:'')+'ExamPlan'}catch(e){}
}
function renderFab(){
  const f=$('#fab');const hide=ui.view==='meer';
  f.hidden=hide;f.innerHTML=icon('plus',24)+'<span>Nieuwe taak</span>';
  f.dataset.s=ui.view==='vakken'&&ui.subj?ui.subj:'';f.dataset.d=ui.view==='dag'?ui.date:'';
}
function render(){
  const app=$('#app');const y=window.scrollY;
  let h='';
  try{
    if(ui.view==='dag')h=viewDag();else if(ui.view==='week')h=viewWeek();
    else if(ui.view==='vakken')h=ui.subj?viewVak():viewVakken();
    else if(ui.view==='toetsen')h=viewToetsen();else h=viewMeer();
  }catch(e){h=`<div class="note warn" style="margin-top:16px">Er ging iets mis bij het laden van dit scherm. Ga naar een ander tabblad en probeer het opnieuw.</div>`;try{console.error(e)}catch(_){}}
  app.innerHTML=h;renderNav();renderBell();renderFab();syncBadge();
  window.scrollTo(0,y);
}
function go(v){ui.view=v;ui.subj=null;render();window.scrollTo(0,0)}

/* ---------- sheets ---------- */
function showSheet(html){
  const el=$('#sheet');el.innerHTML=`<div class="scrim" data-act="sheet-close"></div><div class="sh" role="dialog" aria-modal="true">${html}</div>`;
  el.classList.add('open');document.body.classList.add('lock');
  const f=$('#sheet [data-autofocus]');if(f)setTimeout(()=>{try{f.focus()}catch(e){}},60);
}
function closeSheet(){const el=$('#sheet');el.classList.remove('open');el.innerHTML='';document.body.classList.remove('lock');cur=null}
function head(t){return `<div class="sh-head"><h2>${t}</h2><button class="icon-btn" data-act="sheet-close" aria-label="Sluiten">${icon('x',22)}</button></div>`}
function subjChips(f){return `<div class="chips" role="group" aria-label="Vak">${SUBJ.map(s=>`<button type="button" class="chip subj" data-act="set" data-set="subject:${s.id}" style="--c:${s.color}" aria-pressed="false"><i></i>${esc(s.name)}</button>`).join('')}</div>`}
function syncSheet(){
  if(!cur)return;const f=cur.f;
  $$('#sheet [data-set]').forEach(b=>{const s=b.dataset.set,i=s.indexOf(':');b.setAttribute('aria-pressed',String(f[s.slice(0,i)])===s.slice(i+1))});
  $$('#sheet [data-f]').forEach(inp=>{if(inp===document.activeElement)return;const v=f[inp.dataset.f];if(String(inp.value)!==String(v==null?'':v))inp.value=v==null?'':v});
  $$('#sheet [data-rd]').forEach(b=>b.setAttribute('aria-pressed',(f.remindDays||[]).includes(+b.dataset.rd)));
  const rl=$('#f-remlabel');if(rl)rl.textContent=f.remind?`Herinnering: ${fmtDT(f.remind)}`:'Geen herinnering';
}
function openTask(id,pre){
  pre=pre||{};const ex=id?S.tasks.find(t=>t.id===id):null;
  const f=ex?Object.assign({},ex):{id:uid(),subject:pre.subject||L.lastSubject||'wib',title:pre.title||'',notes:pre.notes||'',date:pre.date||(ui.view==='dag'?ui.date:today()),due:pre.due||'',min:30,where:'thuis',done:false,doneAt:0,remind:''};
  const t0=today(),tm=addDays(t0,1);
  cur={f:f,kind:'task',save(){
    f.title=f.title.trim();
    if(!f.title){$('#f-err').hidden=false;$('#f-title').focus();return}
    if(!f.date)f.date=today();f.min=clamp(parseInt(f.min)||0,0,1440);
    const i=S.tasks.findIndex(t=>t.id===f.id);if(i>=0)S.tasks[i]=f;else S.tasks.push(f);
    L.lastSubject=f.subject;L.welcomed=true;saveLocal();save();closeSheet();render();
    toast('Taak opgeslagen',`${subj(f.subject).name}, ${rel(f.date)}`);checkReminders();
  },del(){S.tasks=S.tasks.filter(t=>t.id!==f.id);save();closeSheet();render();toast('Taak verwijderd','',{icon:'x'})}};
  showSheet(`${head(ex?'Taak aanpassen':'Nieuwe taak')}<div class="sh-body">
    <div class="field" style="margin-top:6px"><label for="f-title">Wat moet je doen?</label><input type="text" id="f-title" data-f="title" data-autofocus value="${esc(f.title)}" placeholder="Bijv. opgave 12 t/m 18 maken" autocomplete="off" enterkeyhint="done"><p class="err" id="f-err" hidden>Geef de taak een naam.</p></div>
    <div class="field"><span class="lab">Vak</span>${subjChips(f)}</div>
    <div class="field"><label for="f-date">Inplannen op</label><div class="chips quick"><button type="button" class="chip" data-act="set" data-set="date:${t0}" aria-pressed="false">Vandaag</button><button type="button" class="chip" data-act="set" data-set="date:${tm}" aria-pressed="false">Morgen</button></div><input type="date" id="f-date" data-f="date" value="${f.date}"></div>
    <div class="field"><label for="f-due">Deadline (wanneer moet het af zijn?)</label><input type="date" id="f-due" data-f="due" value="${f.due}"><div class="chips" style="margin-top:8px"><button type="button" class="chip" data-act="set" data-set="due:" aria-pressed="false">Geen deadline</button></div></div>
    <div class="field"><span class="lab">Hoe lang duurt het?</span><div class="chips quick">${[15,30,45,60,90,120].map(m=>`<button type="button" class="chip" data-act="set" data-set="min:${m}" aria-pressed="false">${fmtMin(m)}</button>`).join('')}</div><input type="number" inputmode="numeric" min="0" max="1440" step="5" data-f="min" value="${f.min}" aria-label="Minuten" style="max-width:140px"><p class="hint">In minuten, of kies hierboven.</p></div>
    <div class="field"><span class="lab">Waar maak je het?</span><div class="chips"><button type="button" class="chip" data-act="set" data-set="where:thuis" aria-pressed="false">${icon('home',16)}Thuis</button><button type="button" class="chip" data-act="set" data-set="where:school" aria-pressed="false">${icon('school',16)}Op school</button></div></div>
    <div class="field"><span class="lab">Herinnering</span><div class="chips quick"><button type="button" class="chip" data-act="rem" data-k="none" aria-pressed="false">Geen</button><button type="button" class="chip" data-act="rem" data-k="day" aria-pressed="false">Op de dag zelf</button><button type="button" class="chip" data-act="rem" data-k="eve" aria-pressed="false">Avond ervoor</button><button type="button" class="chip" data-act="rem" data-k="due" aria-pressed="false">Dag voor deadline</button></div><input type="datetime-local" data-f="remind" value="${f.remind}" aria-label="Eigen tijd voor herinnering"><p class="hint" id="f-remlabel"></p></div>
    <div class="field"><label for="f-notes">Notities</label><textarea id="f-notes" data-f="notes" placeholder="Bijv. paragraaf 4.2, leer de formules">${esc(f.notes)}</textarea></div>
  </div><div class="sh-foot">${ex?`<button class="btn danger" data-act="sheet-del">Verwijderen</button>`:''}<button class="btn primary" data-act="sheet-save">Opslaan</button></div>`);
  syncSheet();
}
function openTest(id,pre){
  pre=pre||{};const ex=id?S.tests.find(t=>t.id===id):null;
  const f=ex?Object.assign({},ex,{remindDays:(ex.remindDays||[]).slice()}):{id:uid(),subject:pre.subject||L.lastSubject||'wib',kind:'Toets',title:'',date:addDays(today(),7),remindDays:[7,1]};
  cur={f:f,kind:'test',save(){
    f.title=f.title.trim();if(!f.date){$('#f-err').hidden=false;return}
    const i=S.tests.findIndex(t=>t.id===f.id);if(i>=0)S.tests[i]=f;else S.tests.push(f);
    L.lastSubject=f.subject;L.welcomed=true;saveLocal();save();closeSheet();render();
    toast(`${f.kind} opgeslagen`,`${subj(f.subject).name}, ${rel(f.date)}`,{icon:'flag'});checkReminders();
  },del(){S.tests=S.tests.filter(t=>t.id!==f.id);save();closeSheet();render();toast(`${f.kind} verwijderd`,'',{icon:'x'})}};
  showSheet(`${head(ex?'Toets aanpassen':'Nieuwe toets')}<div class="sh-body">
    <div class="field" style="margin-top:6px"><span class="lab">Vak</span>${subjChips(f)}</div>
    <div class="field"><span class="lab">Soort</span><div class="chips">${KINDS.map(k=>`<button type="button" class="chip" data-act="set" data-set="kind:${k}" aria-pressed="false">${k}</button>`).join('')}</div></div>
    <div class="field"><label for="f-title">Onderwerp (niet verplicht)</label><input type="text" id="f-title" data-f="title" value="${esc(f.title)}" placeholder="Bijv. hoofdstuk 4 en 5" autocomplete="off"></div>
    <div class="field"><label for="f-date">Datum</label><input type="date" id="f-date" data-f="date" value="${f.date}"><p class="err" id="f-err" hidden>Kies een datum.</p></div>
    <div class="field"><span class="lab">Herinneringen om ${esc(S.set.remindTime)}</span><div class="chips">${[[7,'1 week ervoor'],[3,'3 dagen ervoor'],[1,'1 dag ervoor'],[0,'Op de dag zelf']].map(r=>`<button type="button" class="chip" data-act="rd" data-rd="${r[0]}" aria-pressed="false">${r[1]}</button>`).join('')}</div><p class="hint">De tijd pas je aan bij Instellingen.</p></div>
  </div><div class="sh-foot">${ex?`<button class="btn danger" data-act="sheet-del">Verwijderen</button>`:''}<button class="btn primary" data-act="sheet-save">Opslaan</button></div>`);
  syncSheet();
}
function openTime(){
  const d=ui.date,f={thuis:capFor(d,'thuis'),school:capFor(d,'school')};
  cur={f:f,kind:'time',save(){
    f.thuis=clamp(parseInt(f.thuis)||0,0,1440);f.school=clamp(parseInt(f.school)||0,0,1440);
    S.over[d]={thuis:f.thuis,school:f.school};save();closeSheet();render();
  },reset(){delete S.over[d];save();closeSheet();render();toast('Standaardtijd hersteld',fmtL(d),{icon:'clock'})}};
  showSheet(`${head('Tijd voor '+esc(fmtD(d)))}<div class="sh-body"><p style="color:var(--ink2);margin-top:4px">Hoeveel minuten heb je op deze dag voor huiswerk?</p>
    <div class="field two"><div><label for="t-h" style="display:block;margin-bottom:8px;font-weight:700;font-size:14.5px">Thuis (min)</label><input type="number" inputmode="numeric" id="t-h" min="0" max="1440" step="5" data-f="thuis" value="${f.thuis}" data-autofocus></div><div><label for="t-s" style="display:block;margin-bottom:8px;font-weight:700;font-size:14.5px">School (min)</label><input type="number" inputmode="numeric" id="t-s" min="0" max="1440" step="5" data-f="school" value="${f.school}"></div></div>
    <div class="chips" style="margin-top:12px">${[0,30,60,90,120,180].map(m=>`<button type="button" class="chip" data-act="set-both" data-m="${m}">${m===0?'Geen tijd':fmtMin(m)+' thuis'}</button>`).join('')}</div>
  </div><div class="sh-foot">${S.over[d]?`<button class="btn" data-act="time-reset">Standaard</button>`:''}<button class="btn primary" data-act="sheet-save">Opslaan</button></div>`);
}
function openAlerts(){
  L.alerts.forEach(a=>a.seen=true);saveLocal();renderBell();
  showSheet(`${head('Herinneringen')}<div class="sh-body">${L.alerts.length?L.alerts.map(a=>`<div class="alert-item"><strong>${esc(a.title)}${a.missed?'<em>gemist</em>':''}</strong><span>${esc(a.body)}</span><br><span>${esc(fmtDT(ymd(new Date(a.at))+'T'+pad(new Date(a.at).getHours())+':'+pad(new Date(a.at).getMinutes())))}</span></div>`).join(''):`<div class="empty"><strong>Geen herinneringen</strong>Stel een herinnering in bij een taak of toets. Die verschijnt hier.</div>`}</div>
    <div class="sh-foot">${L.alerts.length?`<button class="btn" data-act="alerts-clear">Wissen</button>`:''}<button class="btn primary" data-act="sheet-close">Sluiten</button></div>`);
}

/* ---------- lightbox ---------- */
let lbId=null;
function openLb(id){
  const p=photos.find(x=>x.id===id);if(!p)return;lbId=id;const s=subj(p.subject);
  const el=$('#lightbox');
  el.innerHTML=`<div class="lb-bar"><button data-act="lb-close">${icon('left',20)}Terug</button><span>${esc(s.name)}, ${fmtD(ymd(new Date(p.ts)))}</span></div>
  <div class="lb-stage"><img src="${p.data}" alt="Planner-foto ${esc(s.name)}" data-act="lb-zoom"></div>
  <div class="lb-foot"><input type="text" id="lbcap" value="${esc(p.caption)}" placeholder="Bijschrift, bv. week 40 t/m 43" aria-label="Bijschrift"><button class="btn" data-act="lb-task">${icon('plus',18)}Taak maken</button><button class="btn danger" data-act="lb-del">Verwijderen</button></div>`;
  el.classList.add('open');document.body.classList.add('lock');
}
function closeLb(){$('#lightbox').classList.remove('open');$('#lightbox').innerHTML='';document.body.classList.remove('lock');lbId=null}

/* ---------- actions ---------- */
function arm(el,label,fn){
  if(el.dataset.armed){fn();return}
  const old=el.textContent;el.dataset.armed='1';el.textContent=label;
  setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=old}},4000);
}
function toggleTask(id,el){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?Date.now():0;save();
  const row=el.closest('.task');if(row)row.classList.toggle('is-done',t.done);
  setTimeout(render,240);
}
const A={
  nav:el=>go(el.dataset.v),
  'day-prev':()=>{ui.date=addDays(ui.date,-1);render()},
  'day-next':()=>{ui.date=addDays(ui.date,1);render()},
  'day-today':()=>{ui.date=today();render()},
  'open-day':el=>{ui.date=el.dataset.d;go('dag')},
  'week-prev':()=>{ui.ws=addDays(ui.ws,-7);render()},
  'week-next':()=>{ui.ws=addDays(ui.ws,7);render()},
  'week-this':()=>{ui.ws=weekStart(today());render()},
  filter:el=>{ui.filter=el.dataset.f;render()},
  toggle:(el)=>toggleTask(el.dataset.id,el),
  'edit-task':el=>openTask(el.dataset.id),
  'new-task':el=>openTask(null,{date:el.dataset.d||undefined,subject:el.dataset.s||undefined}),
  'move-today':el=>{const t=S.tasks.find(x=>x.id===el.dataset.id);if(t){t.date=today();save();render();toast('Verplaatst naar vandaag','',{icon:'calendar'})}},
  'subj-open':el=>{ui.view='vakken';ui.subj=el.dataset.id;render();window.scrollTo(0,0)},
  'subj-back':()=>{ui.subj=null;render();window.scrollTo(0,0)},
  'new-test':el=>openTest(null,{subject:el.dataset.s||undefined}),
  'edit-test':el=>openTest(el.dataset.id),
  'plan-study':el=>{const x=S.tests.find(t=>t.id===el.dataset.id);if(x)openTask(null,{subject:x.subject,title:`Leren voor ${x.kind.toLowerCase()}${x.title?': '+x.title:''}`,due:x.date,date:today()})},
  'edit-time':()=>openTime(),
  'hide-welcome':()=>{L.welcomed=true;saveLocal();render()},
  bell:()=>openAlerts(),
  'alerts-clear':()=>{L.alerts=[];saveLocal();renderBell();openAlerts()},
  'sheet-close':()=>closeSheet(),
  'sheet-save':()=>{if(cur)cur.save()},
  'sheet-del':el=>{if(cur)arm(el,'Zeker weten?',()=>cur.del())},
  'time-reset':()=>{if(cur&&cur.reset)cur.reset()},
  'set-both':el=>{if(cur){cur.f.thuis=+el.dataset.m;syncSheet()}},
  set:el=>{if(!cur)return;const s=el.dataset.set,i=s.indexOf(':'),k=s.slice(0,i),v=s.slice(i+1);cur.f[k]=k==='min'?+v:v;syncSheet()},
  rem:el=>{
    if(!cur)return;const f=cur.f,k=el.dataset.k;let v='';
    if(k==='day')v=`${f.date}T${S.set.remindTime}`;
    else if(k==='eve')v=`${addDays(f.date,-1)}T19:00`;
    else if(k==='due'){if(!f.due){toast('Kies eerst een deadline','Dan kunnen we de dag ervoor herinneren.',{icon:'flag'});return}v=`${addDays(f.due,-1)}T${S.set.remindTime}`}
    f.remind=v;syncSheet();
  },
  rd:el=>{if(!cur)return;const d=+el.dataset.rd,a=cur.f.remindDays||(cur.f.remindDays=[]),i=a.indexOf(d);if(i>=0)a.splice(i,1);else a.push(d);syncSheet()},
  'photo-cam':el=>{ui.photoSubj=el.dataset.id;$('#fileCam').click()},
  'photo-gal':el=>{ui.photoSubj=el.dataset.id;$('#fileGal').click()},
  'photo-open':el=>openLb(el.dataset.id),
  'lb-close':()=>closeLb(),
  'lb-zoom':el=>el.classList.toggle('zoom'),
  'lb-task':()=>{const p=photos.find(x=>x.id===lbId);if(!p)return;const sid=p.subject;closeLb();openTask(null,{subject:sid,notes:`Zie planner-foto van ${fmtD(ymd(new Date(p.ts)))}${p.caption?' ('+p.caption+')':''}`})},
  'lb-del':el=>arm(el,'Zeker weten?',async()=>{const id=lbId;try{await idbDel(id)}catch(e){}photos=photos.filter(p=>p.id!==id);closeLb();render();toast('Foto verwijderd','',{icon:'x'})}),
  'toast-x':el=>el.closest('.toast').remove(),
  'notif-on':async()=>{try{await Notification.requestPermission()}catch(e){}render()},
  'notif-test':()=>{toast('Testmelding','Zo ziet een herinnering eruit.',{kind:'rem',icon:'bell',ttl:5000});sysNotify('ExamPlan','Zo ziet een herinnering eruit.','test')},
  theme:el=>{L.theme=el.dataset.t;saveLocal();applyTheme();render()},
  'bk-make':()=>{const o=JSON.parse(JSON.stringify(S));const t=$('#bk');t.value=JSON.stringify(o);t.focus();t.select();$('#bk-msg').textContent='Back-up staat klaar. Kopieer hem en bewaar hem ergens veilig.'},
  'bk-copy':async()=>{const t=$('#bk');if(!t.value)A['bk-make']();let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{t.select();ok=document.execCommand('copy')}catch(_){}}$('#bk-msg').textContent=ok?'Gekopieerd.':'Kopiëren lukt hier niet. De tekst is geselecteerd, kopieer hem zelf.'},
  'bk-restore':el=>{
    const t=$('#bk');let o=null;
    try{o=JSON.parse(t.value)}catch(e){}
    if(!o||!Array.isArray(o.tasks)||!Array.isArray(o.tests)){$('#bk-msg').textContent='Dit lijkt geen geldige back-up. Plak de volledige tekst van een eerdere back-up.';return}
    arm(el,'Zeker? Dit overschrijft alles',()=>{S=normalize(o);save();render();toast('Back-up hersteld',`${S.tasks.length} taken, ${S.tests.length} toetsen`)});
  },
  'reset-all':el=>arm(el,'Zeker weten?',()=>{S=defSynced();L.fired={};L.alerts=[];L.welcomed=false;saveLocal();save();render();toast('Alles gewist','',{icon:'x'})})
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn){if(el.tagName==='A')e.preventDefault();fn(el,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#lightbox').classList.contains('open'))closeLb();else if($('#sheet').classList.contains('open'))closeSheet();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='f-title'&&cur){e.preventDefault();cur.save()}
});
function onField(t){
  if(!cur||!t.dataset.f)return;const k=t.dataset.f;
  cur.f[k]=(k==='min'||k==='thuis'||k==='school')?(t.value===''?'':+t.value):t.value;
  if(k==='title'){const er=$('#f-err');if(er&&cur.kind==='task')er.hidden=true}
  syncSheet();
}
document.addEventListener('input',e=>onField(e.target));
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cap){const p=t.dataset.cap.split(':');S.cap[p[0]][+p[1]]=clamp(parseInt(t.value)||0,0,1440);t.value=S.cap[p[0]][+p[1]];save()}
  else if(t.dataset.sset){const k=t.dataset.sset;S.set[k]=t.type==='checkbox'?t.checked:t.value;save();checkReminders()}
  else if(t.id==='lbcap'){const p=photos.find(x=>x.id===lbId);if(p){p.caption=t.value.trim();idbPut(p).catch(()=>{})}}
  else onField(t);
});
$('#fileCam').addEventListener('change',e=>{const fs=Array.from(e.target.files||[]);e.target.value='';if(fs.length&&ui.photoSubj)addPhotos(fs,ui.photoSubj)});
$('#fileGal').addEventListener('change',e=>{const fs=Array.from(e.target.files||[]);e.target.value='';if(fs.length&&ui.photoSubj)addPhotos(fs,ui.photoSubj)});

/* ---------- theme, icon, boot ---------- */
function applyTheme(){const r=document.documentElement;if(L.theme==='light'||L.theme==='dark')r.setAttribute('data-theme',L.theme);else r.removeAttribute('data-theme')}
function makeIcon(){
  try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');if(!x)return'';
    x.fillStyle='#2B47F5';x.fillRect(0,0,180,180);x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;
    for(let i=0;i<=180;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,180);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(180,i);x.stroke()}
    x.strokeStyle='#FFD43B';x.lineWidth=16;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(50,94);x.lineTo(80,124);x.lineTo(132,60);x.stroke();
    return c.toDataURL('image/png')}catch(e){return''}
}
applyTheme();
ICON=makeIcon();
if(ICON){try{const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ICON;document.head.appendChild(l)}catch(e){}}
render();
const appEl=$('#app');appEl.classList.add('intro');setTimeout(()=>appEl.classList.remove('intro'),1200);
checkReminders();
setInterval(checkReminders,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();if(ui.date===today()&&ui.view==='dag')render()}});
setInterval(()=>{const t=today();if(ui._day&&ui._day!==t){ui.date=t;ui.ws=weekStart(t);render()}ui._day=t},60000);ui._day=today();
photosInit();
initSync();
})();
</script>
